# Loader patch for the dsh-retry-llm-plugin bundle.
# Installs one Host plugin entry. The row name must match the package name.
# Tune behavior under `config`; see README for every option.
- insert:
    - id: retry-llm-plugin
      name: dsh-retry-llm-plugin
      config:
        mode: always
        maxRetries: 50
        backoff:
          initialDelayMs: 500
          maxDelayMs: 30000
          jitterRatio: 0.2
        respectProviderRetryAfter: true
